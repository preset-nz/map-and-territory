[package]
name = "map-and-territory"
version = "0.1.0"
description = "A preset.nz desktop app"
authors = ["preset.nz"]
license = "MIT"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows
# linker quirk, see https://github.com/rust-lang/cargo/issues/8519).
name = "map_and_territory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The family's menu bar, Undo titles and relaunch restore.
preset-app-kit = "0.1.2"
# The document tree, its kinds and commands: rhizome and POM from crates.io. The
# object model has no Tauri in it; the Tauri half (rhizome-pom-tauri) is the document
# host's transport.
rhizome-core = "0.1.4"
rhizome-pom = "0.1.4"
rhizome-pom-tauri = "0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# A mock app, so the host's emitted events can be heard in tests.
tauri = { version = "2", features = ["test"] }

# rhizome by path until the next publish (Family requirements: path dependencies). 0.1.5 brings
# the shared-node edits (rhizome d55ec54) and Node::value_ref that keep a paint frame under 1 ms.
[patch.crates-io]
rhizome-core = { path = "../../../packages/rhizome/crates/rhizome-core" }
rhizome-pom = { path = "../../../packages/rhizome/crates/rhizome-pom" }
rhizome-pom-tauri = { path = "../../../packages/rhizome/crates/rhizome-pom-tauri" }
