[package]
name = "map-and-territory"
version = "0.1.0"
description = "A preset.nz desktop app"
authors = ["preset.nz"]
license = "MIT"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows
# linker quirk, see https://github.com/rust-lang/cargo/issues/8519).
name = "map_and_territory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The family's menu bar, Undo titles and relaunch restore.
preset-app-kit = "0.1.3"
# The campaign's kinds and commands, in their own Tauri-free crate.
map-and-territory-model = { path = "../crates/map-and-territory-model" }
# The document tree: rhizome and POM from crates.io. The Tauri half (rhizome-pom-tauri)
# is the document host's transport.
rhizome-core = "0.1.5"
rhizome-pom = "0.1.5"
rhizome-pom-tauri = "0.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# A mock app, so the host's emitted events can be heard in tests.
tauri = { version = "2", features = ["test"] }
